apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 60m
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: loki
        namespace: monitoring
      interval: 12h
  values:
    # the chart's default SimpleScalable mode needs object storage; one pod on a PVC suits one node
    deploymentMode: SingleBinary
    backend:
      replicas: 0
    # each memcached cache requests gigabytes of memory, more than the homelab can spare
    chunksCache:
      enabled: false
    # Alloy and Grafana are in-cluster and talk to the Loki service directly
    gateway:
      enabled: false
    loki:
      # single tenant: no client sends an X-Scope-OrgID header
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      compactor:
        delete_request_store: filesystem
        retention_enabled: true
      limits_config:
        # 7 days; sized against the 10Gi volume below
        retention_period: 168h
      schemaConfig:
        # never edited once logs exist: a schema change is a new entry with a later date
        configs:
          - from: "2026-10-12"
            index:
              period: 24h
              prefix: loki_index_
            object_store: filesystem
            schema: v13
            store: tsdb
      storage:
        type: filesystem
    # the canary and the Helm test push synthetic logs; nothing here reads them
    lokiCanary:
      enabled: false
    read:
      replicas: 0
    resultsCache:
      enabled: false
    singleBinary:
      persistence:
        size: 10Gi
      replicas: 1
    test:
      enabled: false
    write:
      replicas: 0
