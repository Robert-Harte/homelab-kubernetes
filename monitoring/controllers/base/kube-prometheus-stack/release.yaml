apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 60m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "84.0.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      additionalDataSources:
        - access: proxy
          name: Loki
          type: loki
          url: http://loki.monitoring.svc:3100
      envFrom:
        - secretRef:
            name: grafana-env
      route:
        main:
          enabled: true
          hostnames:
            - grafana.robertharte.home
          parentRefs:
            - kind: Gateway
              name: traefik-gateway
              namespace: traefik-gateway
              sectionName: http
            - kind: Gateway
              name: traefik-gateway
              namespace: traefik-gateway
              sectionName: https
    prometheus:
      prometheusSpec:
        # under the 5Gi claim: a full volume stops Prometheus writing instead of pruning
        retentionSize: 4GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
