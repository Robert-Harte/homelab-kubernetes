apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Work:
        - Github:
            - abbr: GH
              href: https://github.com/
        - WhatsApp:
            - abbr: WA
              href: https://web.whatsapp.com/
        - GoogleChat:
            - abbr: GC
              href: https://chat.google.com/app/home
        - GoogleDrive:
            - abbr: GD
              href: https://drive.google.com/drive/u/0/home
    - Internal:
        - LinkDing:
            - href: https://linkding.robertharte.home/
              description: LinkDing
        - Mealie:
            - href: https://mealie.robertharte.home/
              description: Mealie
        - Calibre:
            - href: https://calibre.robertharte.home/
              description: Calibre
        - Jellyfin:
            - href: https://jellyfin.robertharte.home/
              description: Jellyfin Home Media Centre
  services.yaml: |
    - Monitoring:
        - Grafana:
            href: https://grafana.robertharte.home/
    - Database:
        - pgAdmin:
            href: https://pgadmin.robertharte.home/
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
