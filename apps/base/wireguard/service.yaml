apiVersion: v1
kind: Service
metadata:
  labels:
    app: wireguard
  name: wireguard
spec:
  # k3s ServiceLB exposes this on the node IP; forward the router's public
  # 51820/udp -> node:51820 so vpn.robertharte.net:51820 reaches the tunnel.
  type: LoadBalancer
  selector:
    app: wireguard
  ports:
    - name: wireguard
      protocol: UDP
      port: 51820
      targetPort: 51820
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: wireguard
  name: wg-easy
spec:
  # Internal only — the wg-easy UI is reached over the LAN via the HTTPRoute.
  type: ClusterIP
  selector:
    app: wireguard
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 51821
