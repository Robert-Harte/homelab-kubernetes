apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-cache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Mi
---
# Media volume. The external disk is mounted on the cluster node at
# /mnt/jellyfin-media. Single-node cluster, so a hostPath volume reaches it
# directly — no NFS server required. Read-only is enforced on the volumeMount
# in deployment.yaml (hostPath has no readOnly field).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-pv
spec:
  capacity:
    storage: 1Gi # Informational only — Kubernetes does not enforce quotas on hostPath volumes.
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/jellyfin-media
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi # Informational only — must match the PV to allow binding.
  volumeName: jellyfin-media-pv # Binds directly to the PV above by name.
